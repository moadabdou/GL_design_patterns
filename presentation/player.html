<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Player | Document Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030705;
            --primary-green: #00ff9d;
            --primary-glow: rgba(0, 255, 157, 0.3);
            --ui-bg: rgba(10, 20, 15, 0.8);
            --text-main: #f0fdf6;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
        }

        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex-grow: 1;
            background: transparent;
        }

        /* Controls Overlay */
        .controls {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--ui-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 157, 0.2);
            border-radius: 100px;
            z-index: 100;
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Hide controls in fullscreen if requested, or just on idle */
        body.is-fullscreen .controls {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 50px);
        }

        body.is-fullscreen:hover .controls {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, 0);
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            border-radius: 50%;
            transition: all 0.2s ease;
            opacity: 0.7;
        }

        .nav-btn:hover {
            opacity: 1;
            background: rgba(0, 255, 157, 0.1);
            color: var(--primary-green);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .slide-info {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            min-width: 80px;
            text-align: center;
            color: var(--primary-green);
        }

        .fullscreen-btn {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: var(--ui-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 157, 0.2);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 12px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .fullscreen-btn:hover {
            border-color: var(--primary-green);
            box-shadow: 0 0 20px var(--primary-glow);
            color: var(--primary-green);
        }

        body.is-fullscreen .fullscreen-btn {
            display: none;
        }

        /* Loading progress bar at the top */
        .progress-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary-green);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--primary-green);
        }

        /* Keyboard hint overlay (shows initially) */
        .keyboard-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--ui-bg);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid var(--primary-green);
            text-align: center;
            z-index: 200;
            animation: fadeOut 3s forwards 2s;
            pointer-events: none;
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

    </style>
</head>
<body>

    <div id="player-container">
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <button class="fullscreen-btn" id="fullscreen-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
            Fullscreen
        </button>

        <iframe id="slide-frame" src="slide1.html" allowfullscreen></iframe>

        <div class="controls" id="controls">
            <button class="nav-btn" id="prev-btn" title="Previous (Left Arrow)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            
            <div class="slide-info" id="slide-info">1 / 14</div>

            <button class="nav-btn" id="next-btn" title="Next (Right Arrow)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>

        <div class="keyboard-hint">
            <h2 style="color: var(--primary-green); margin-bottom: 1rem;">Use Arrows to Navigate</h2>
            <p style="opacity: 0.7;">Left / Right Arrow keys<br>F to toggle Fullscreen</p>
        </div>
    </div>

    <script>
        const slideFrame = document.getElementById('slide-frame');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const slideInfo = document.getElementById('slide-info');
        const progressBar = document.getElementById('progress-bar');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        let currentSlide = 1;
        const totalSlides = 14;

        function updateSlide() {
            const slidePath = `slide${currentSlide}.html`;
            slideFrame.src = slidePath;
            
            // Update UI
            slideInfo.textContent = `${currentSlide} / ${totalSlides}`;
            progressBar.style.width = `${(currentSlide / totalSlides) * 100}%`;
            
            // Update buttons
            prevBtn.disabled = currentSlide === 1;
            nextBtn.disabled = currentSlide === totalSlides;

            // Sync hash in URL for bookmarking/refreshing
            window.location.hash = `slide${currentSlide}`;
        }

        function nextSlide() {
            if (currentSlide < totalSlides) {
                currentSlide++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                currentSlide--;
                updateSlide();
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Listen for keyboard events on the parent window
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'f' || e.key === 'F') toggleFullscreen();
        });

        // Try to capture keyboard events from the iframe as well
        // (Only works if same-origin)
        slideFrame.addEventListener('load', () => {
            try {
                slideFrame.contentWindow.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight') nextSlide();
                    if (e.key === 'ArrowLeft') prevSlide();
                    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
                });
                
                // Also ensure the iframe doesn't swallow focus if we want parent to handle keys
                // but usually it's better to let iframe have focus for internal interactivity (if any)
            } catch (e) {
                console.warn("Could not attach event listener to iframe content (likely cross-origin).");
            }
        });

        // Handle fullscreen state change for CSS
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                document.body.classList.add('is-fullscreen');
            } else {
                document.body.classList.remove('is-fullscreen');
            }
        });

        // Initialize from Hash
        const hash = window.location.hash;
        if (hash && hash.startsWith('#slide')) {
            const slideNum = parseInt(hash.replace('#slide', ''));
            if (!isNaN(slideNum) && slideNum >= 1 && slideNum <= totalSlides) {
                currentSlide = slideNum;
            }
        }

        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        updateSlide();
    </script>
</body>
</html>
